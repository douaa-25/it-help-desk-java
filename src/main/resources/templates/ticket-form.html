<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau ticket</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container narrow"><a class="back" th:href="@{/dashboard}">← Retour au tableau de bord</a><section class="panel"><p class="eyebrow">SUPPORT TECHNIQUE</p><h1>Créer un ticket</h1><p class="muted">Décrivez votre problème pour que l'équipe informatique puisse vous aider.</p><form th:action="@{/tickets}" method="post"><label>Titre</label><input name="title" maxlength="140" required placeholder="Ex. : Problème de connexion réseau"><label>Catégorie</label><select name="categoryId" required><option value="">Choisir une catégorie</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><label>Description</label><textarea name="description" rows="7" maxlength="4000" required placeholder="Décrivez le problème..."></textarea><button class="primary" type="submit">Envoyer le ticket</button></form></section></main></body></html>
