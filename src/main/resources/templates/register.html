<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription - IT Helpdesk</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth"><section class="panel"><div class="brand">IT <span>Helpdesk</span></div><h1>Créer un compte</h1><form method="post" th:action="@{/register}" th:object="${registerForm}"><label>Nom d'utilisateur</label><input th:field="*{username}" required><small class="error" th:errors="*{username}"></small><label>Email</label><input th:field="*{email}" type="email" required><small class="error" th:errors="*{email}"></small><label>Mot de passe (8 caractères minimum)</label><input th:field="*{password}" type="password" required><small class="error" th:errors="*{password}"></small><button class="primary" type="submit">Créer mon compte</button></form><p class="muted center"><a th:href="@{/login}">Retour à la connexion</a></p></section></main></body></html>
