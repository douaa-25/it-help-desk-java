<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion - IT Helpdesk</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth"><section class="panel"><div class="brand">IT <span>Helpdesk</span></div><h1>Bienvenue</h1><p class="muted">Connectez-vous à votre espace support.</p><p class="success" th:if="${param.registered}">Compte créé. Vous pouvez vous connecter.</p><p class="error" th:if="${param.error}">Identifiants invalides.</p><p class="success" th:if="${param.logout}">Vous êtes déconnecté.</p><form method="post" th:action="@{/login}"><label>Nom d'utilisateur</label><input name="username" required autofocus><label>Mot de passe</label><input name="password" type="password" required><button class="primary" type="submit">Se connecter</button></form><p class="muted center">Pas encore de compte ? <a th:href="@{/register}">Créer un compte</a></p></section></main></body></html>
