<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tableau de bord - IT Helpdesk</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><div class="brand">IT <span>Helpdesk</span></div><div class="user">Connecté : <b th:text="${username}"></b><form th:action="@{/logout}" method="post"><button class="linkbtn">Déconnexion</button></form></div></header><main class="container"><div class="heading"><div><p class="eyebrow">ESPACE SUPPORT</p><h1>Tableau de bord</h1><p class="muted" th:text="${isAdmin ? 'Vue globale des demandes' : 'Suivez vos demandes de support'}"></p></div><a class="primary button" th:href="@{/tickets/new}">+ Nouveau ticket</a></div><p class="success" th:if="${param.created}">Ticket créé avec succès.</p><p class="success" th:if="${param.updated}">Statut mis à jour.</p><section class="panel"><div class="tablehead"><h2 th:text="${isAdmin ? 'Tous les tickets' : 'Mes tickets'}"></h2><span class="count" th:text="${tickets.size()} + ' ticket(s)'"></span></div><div class="empty" th:if="${#lists.isEmpty(tickets)}">Aucun ticket pour le moment.</div><div class="tablewrap" th:if="${!#lists.isEmpty(tickets)}"><table><thead><tr><th>#</th><th>Titre</th><th>Catégorie</th><th>Demandeur</th><th>Date</th><th>Statut</th><th>Action</th></tr></thead><tbody><tr th:each="ticket : ${tickets}"><td th:text="${ticket.id}"></td><td><b th:text="${ticket.title}"></b><div class="muted small" th:text="${ticket.description}"></div></td><td th:text="${ticket.category.name}"></td><td th:text="${ticket.user.username}"></td><td th:text="${#temporals.format(ticket.createdAt,'dd/MM/yyyy HH:mm')}"></td><td><span class="status" th:text="${ticket.status}"></span></td><td><form th:if="${isAdmin}" th:action="@{'/admin/tickets/' + ${ticket.id} + '/status'}" method="post" class="inline"><select name="status"><option th:each="s : ${T(tn.ithelpdesk.model.TicketStatus).values()}" th:value="${s}" th:text="${s}" th:selected="${s == ticket.status}"></option></select><button class="smallbtn">OK</button></form><form th:if="${!isAdmin and ticket.status.name() == 'NEW'}" th:action="@{'/tickets/' + ${ticket.id} + '/cancel'}" method="post"><button class="smallbtn danger">Annuler</button></form></td></tr></tbody></table></div></section><section class="panel adminbox" th:if="${isAdmin}"><h2>Gestion des catégories</h2><form th:action="@{/admin/categories}" method="post" class="inline"><input name="name" placeholder="Nouvelle catégorie" maxlength="80" required><button class="primary">Ajouter</button></form></section><p class="footer">IT Helpdesk · Java / Spring Boot</p></main></body></html>
